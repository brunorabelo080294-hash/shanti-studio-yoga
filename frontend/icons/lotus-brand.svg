<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <defs>
    <style>
      .lotus-sage { fill: #8A937E; }
      .lotus-sage-stroke { stroke: #8A937E; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .lotus-terracotta { fill: #B16A4C; }
      .lotus-terracotta-stroke { stroke: #B16A4C; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .lotus-sand-stroke { stroke: #B59473; fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Left Small Floating Leaf/Droplet -->
  <path class="lotus-sage" d="M 45 74 C 36 60, 48 42, 57 44 C 65 57, 55 76, 45 74 Z" />

  <!-- Right Small Floating Leaf/Droplet -->
  <path class="lotus-terracotta" d="M 195 74 C 204 60, 192 42, 183 44 C 175 57, 185 76, 195 74 Z" />

  <!-- Center Tall Petal (Line Art Warm Sand) -->
  <path class="lotus-sand-stroke" d="M 120 138 C 102 96, 94 52, 120 18 C 146 52, 138 96, 120 138 Z" />

  <!-- Left Upright Inner Leaf (Line Art Sage Green) -->
  <path class="lotus-sage-stroke" d="M 115 132 C 82 106, 60 70, 72 36 C 96 44, 112 85, 102 118" />

  <!-- Right Upright Inner Leaf (Line Art Terracotta) -->
  <path class="lotus-terracotta-stroke" d="M 125 132 C 158 106, 180 70, 168 36 C 144 44, 128 85, 138 118" />

  <!-- Left Lower Broad Leaf (Solid Sage Green with curved ribbon vein) -->
  <path class="lotus-sage" d="M 120 144 C 88 150, 52 134, 18 106 C 42 90, 78 80, 110 98 C 96 106, 80 116, 56 120 C 76 128, 98 136, 120 144 Z" />
  <path class="lotus-sage" d="M 114 97 C 82 82, 48 92, 20 106 C 44 76, 82 72, 110 92 Z" />

  <!-- Right Lower Broad Leaf (Solid Terracotta with curved ribbon vein) -->
  <path class="lotus-terracotta" d="M 120 144 C 152 150, 188 134, 222 106 C 198 90, 162 80, 130 98 C 144 106, 160 116, 184 120 C 164 128, 142 136, 120 144 Z" />
  <path class="lotus-terracotta" d="M 126 97 C 158 82, 192 92, 220 106 C 196 76, 158 72, 130 92 Z" />
</svg>